name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MSVC v143 ARM64 toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) {
            throw "No Visual Studio installation found"
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path $installer)) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          }
          if (-not (Test-Path $installer)) {
            throw "Visual Studio installer not found"
          }

          # Ensure the toolset requested by node-gyp (v143) exists for x64 + ARM64 builds.
          & $installer modify `
            --installPath "$installPath" `
            --quiet --wait --norestart --nocache `
            --add Microsoft.VisualStudio.Component.VC.v143.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.v143.ARM64

          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio component install failed with exit code $LASTEXITCODE"
          }

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Build native addon (${{ matrix.arch }})
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run build-native

      - name: Package extension (win32-${{ matrix.arch }})
        run: npx @vscode/vsce package --target win32-${{ matrix.arch }} --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-win32-${{ matrix.arch }}
          path: '*.vsix'

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '**/*.vsix'
          generate_release_notes: true
